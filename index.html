<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
  }
  .app {
    width: 100%;
    max-width: 380px;
    background: #161616;
    border: 1px solid #2a2a2a;
    border-radius: 20px;
    padding: 1.5rem;
  }
  h1 {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    color: #777;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 1.25rem;
  }
  #current-status {
    text-align: center;
    padding: 1.25rem;
    border-radius: 14px;
    margin-bottom: 1.5rem;
    background: #1f1f1f;
    transition: background 0.4s, color 0.4s;
  }
  #current-status .dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
  }
  #current-status .label {
    font-size: 1.05rem;
    font-weight: 600;
    vertical-align: middle;
  }
  #current-status small {
    display: block;
    font-size: 0.75rem;
    font-weight: 400;
    margin-top: 6px;
    opacity: 0.65;
  }
  #current-status.open  { background: #0d2818; color: #4ade80; }
  #current-status.open  .dot { background: #4ade80; }
  #current-status.closed { background: #2a1212; color: #f87171; }
  #current-status.closed .dot { background: #f87171; }
  #current-status.loading { color: #777; }

  #name-input {
    background: #1f1f1f;
    border: 1px solid #333;
    border-radius: 10px;
    color: #f0f0f0;
    font-size: 0.95rem;
    padding: 0.8rem 1rem;
    width: 100%;
    outline: none;
    margin-bottom: 1rem;
    transition: border-color 0.15s;
  }
  #name-input::placeholder { color: #666; }
  #name-input:focus { border-color: #4ade80; }

  .buttons { display: flex; gap: 0.75rem; margin-bottom: 1rem; }
  button {
    border: 1px solid transparent;
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.9rem;
    transition: opacity 0.15s, transform 0.1s, filter 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  button:active { transform: scale(0.97); }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  #btn-open  { background: #0d2818; color: #4ade80; border-color: #1c4a30; flex: 1; }
  #btn-close { background: #2a1212; color: #f87171; border-color: #4a1c1c; flex: 1; }

  #status-msg {
    font-size: 0.8rem;
    color: #777;
    min-height: 1.4em;
    text-align: center;
    margin-bottom: 1rem;
  }

  #subscribe {
    width: 100%;
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #999;
    font-weight: 500;
    font-size: 0.85rem;
  }
  #subscribe:hover { border-color: #444; color: #f0f0f0; background: transparent; }

  .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Studio Status</h1>

  <div id="current-status" class="loading">
    <span class="label">Carregando…</span>
  </div>

  <input id="name-input" type="text" placeholder="Seu nome" maxlength="30" />

  <div class="buttons">
    <button id="btn-open">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
      Open
    </button>
    <button id="btn-close">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 9l-6 6M9 9l6 6"/><circle cx="12" cy="12" r="10"/></svg>
      Closed
    </button>
  </div>

  <p id="status-msg">—</p>

  <button id="subscribe">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Ativar notificações
  </button>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js";
  import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDSokIjZr-psnD98K8SxArv86xZje1ih10",
    authDomain: "studioopen-a3957.firebaseapp.com",
    projectId: "studioopen-a3957",
    storageBucket: "studioopen-a3957.firebasestorage.app",
    messagingSenderId: "333518249480",
    appId: "1:333518249480:web:29c56bbec557cc18ff3bbd"
  };

  const VAPID_KEY = "BBttzy9AljP2LUdGk2E0HnfGmjBAKDPEeE4lhkNUUX6q4xDS4j1QKbEN5H2yiIolsbxl-gjMNhZMqa2m7eVgQR8";

  const app = initializeApp(firebaseConfig);
  const messaging = getMessaging(app);
  const functions = getFunctions(app);
  const db = getFirestore(app);
  const statusMsg = document.getElementById("status-msg");
  const currentStatus = document.getElementById("current-status");

  const TWELVE_HOURS_MS = 12 * 60 * 60 * 1000;
  let lastData = null;

  function render() {
    if (!lastData) {
      currentStatus.className = "loading";
      currentStatus.innerHTML = `<span class="label">Sem status ainda.</span>`;
      return;
    }
    const { state, name, updatedAt } = lastData;
    const isStale = !updatedAt || (Date.now() - updatedAt) > TWELVE_HOURS_MS;
    const isOpen = state === "open" && !isStale;

    currentStatus.className = isOpen ? "open" : "closed";

    if (isStale) {
      currentStatus.innerHTML = `
        <span class="dot"></span><span class="label">Studio Closed</span>
        <small>sem atualização há mais de 12h</small>
      `;
    } else {
      currentStatus.innerHTML = `
        <span class="dot"></span><span class="label">${isOpen ? "Studio Open" : "Studio Closed"}</span>
        <small>por ${name}</small>
      `;
    }
  }

  onSnapshot(doc(db, "status", "current"), (snap) => {
    lastData = snap.exists() ? snap.data() : null;
    render();
  }, (error) => {
    console.error("onSnapshot error:", error);
    statusMsg.textContent = "Erro ao escutar status: " + error.message;
  });

  setInterval(render, 30 * 1000);

  document.getElementById("subscribe").addEventListener("click", async () => {
    try {
      const permission = await Notification.requestPermission();
      if (permission !== "granted") { statusMsg.textContent = "Permissão negada."; return; }
      const swReg = await navigator.serviceWorker.register("/studio-open/firebase-messaging-sw.js");
      const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: swReg });
      await setDoc(doc(db, "tokens", token), { createdAt: Date.now() });
      statusMsg.textContent = "✓ Notificações ativadas!";
    } catch (e) {
      statusMsg.textContent = "Erro ao ativar: " + e.message;
    }
  });

  onMessage(messaging, (payload) => {
    if (typeof Notification !== "undefined") {
      new Notification(payload.notification.title, { body: payload.notification.body });
    }
  });

  async function sendStatus(state) {
    const name = document.getElementById("name-input").value.trim() || "Alguém";
    const btns = document.querySelectorAll("button");
    btns.forEach(b => b.disabled = true);
    statusMsg.textContent = "Enviando…";
    try {
      await setDoc(doc(db, "status", "current"), { state, name, updatedAt: Date.now() });
      const fn = httpsCallable(functions, "sendStudioNotification");
      const result = await fn({ status: state, name });
      statusMsg.textContent = `✓ Enviado para ${result.data.sent} pessoa(s).`;
    } catch (e) {
      statusMsg.textContent = "Erro: " + e.message;
    } finally {
      btns.forEach(b => b.disabled = false);
    }
  }

  document.getElementById("btn-open").addEventListener("click", () => sendStatus("open"));
  document.getElementById("btn-close").addEventListener("click", () => sendStatus("closed"));
</script>
</body>
</html>
